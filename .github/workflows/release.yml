# Build the Arch package for every version tag and attach it to a GitHub
# release. hypr-shell's installer downloads this .pkg.tar.zst instead of
# compiling the Rust/Tauri app on the user's machine (a ~10 minute build).
#
# Flow: push a tag `vX.Y.Z` (matching pkgver in PKGBUILD) → this job builds
# in an Arch container with makepkg → `gh release create` with the package.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Build Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        # rust ships cargo on Arch; github-cli is for the release upload.
        run: |
          pacman -Syu --noconfirm --needed \
            git nodejs npm rust openssl pkgconf github-cli \
            webkit2gtk-4.1 gtk3 libayatana-appindicator polkit

      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Build the package with makepkg
        run: |
          pkgver="${GITHUB_REF_NAME#v}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # The source tarball IS this checkout — no network fetch and no
          # checksum chicken-and-egg (the PKGBUILD inside a tag cannot pin the
          # hash of its own tarball). makepkg finds the file in the start dir
          # because the name matches the PKGBUILD's source entry.
          git archive --format=tar.gz --prefix="komble-arch-$pkgver/" \
            -o "komble-arch-$pkgver.tar.gz" HEAD
          # makepkg refuses to run as root; deps are preinstalled above, and
          # -d skips the dependency resolution that would otherwise want sudo.
          useradd -m builder
          chown -R builder: .
          su builder -c "makepkg -d --noconfirm --skipchecksums"

      - name: Attach the package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes *.pkg.tar.zst \
          || gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
               --clobber *.pkg.tar.zst
